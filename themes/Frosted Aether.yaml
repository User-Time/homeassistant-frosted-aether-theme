  card-mod-root: |
    :host {
      --app-header-background-color: rgba(10,18,32,.82);
      --app-header-text-color: #f5f8ff;
    }
    home-assistant, ha-app-layout, #view {
      background: var(--lovelace-background) !important;
      background-attachment: fixed !important;
      color: #f5f8ff;
    }
    app-header, app-toolbar {
      background: linear-gradient(90deg,rgba(10,18,32,.88),rgba(13,24,42,.82) 48%,rgba(16,21,43,.88)) !important;
      border-bottom: 1px solid rgba(126,190,255,.10);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      box-shadow: 0 10px 28px rgba(0,0,0,.20);
    }
  card-mod-sidebar: |
    :host {
      background: radial-gradient(circle at 18% 4%,rgba(70,181,255,.08),transparent 34%),linear-gradient(180deg,rgba(10,18,32,.94),rgba(11,16,30,.97)) !important;
      border-right: 1px solid rgba(126,190,255,.10);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }
    .selected {
      border-radius: 12px;
      background: linear-gradient(90deg,rgba(70,181,255,.12),rgba(127,108,255,.08)) !important;
    }
  card-mod-view: |
    :host, hui-view, hui-sections-view, hui-panel-view, hui-masonry-view { background: transparent !important; }
  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      color: #f5f8ff;
      border: 1px solid rgba(126,190,255,.16) !important;
      border-radius: 18px !important;
      background: radial-gradient(circle at 8% 0%,rgba(70,181,255,.075),transparent 30%),radial-gradient(circle at 100% 100%,rgba(127,108,255,.06),transparent 32%),linear-gradient(145deg,rgba(20,33,54,.79),rgba(12,21,36,.72) 60%,rgba(15,23,40,.80)) !important;
      box-shadow: 0 14px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter: blur(15px) saturate(128%);
      -webkit-backdrop-filter: blur(15px) saturate(128%);
      transition: transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease;
    }
    ha-card:hover {
      transform: translateY(-1px);
      border-color: rgba(126,190,255,.30) !important;
      box-shadow: 0 18px 46px rgba(0,0,0,.32),0 0 28px rgba(70,181,255,.075),0 0 46px rgba(127,108,255,.045);
    }
    ha-card a { color: #72d9ff; }
  card-mod-row: |
    :host { border-radius: 12px; transition: background 160ms ease; }
    :host(:hover) { background: linear-gradient(90deg,rgba(70,181,255,.055),rgba(127,108,255,.035)); }
  card-mod-badge: |
    :host {
      border: 1px solid rgba(126,190,255,.18);
      border-radius: 999px;
      background: rgba(15,25,42,.72);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      backdrop-filter: blur(12px) saturate(125%);
      -webkit-backdrop-filter: blur(12px) saturate(125%);
    }
  card-mod-assist-chip: |
    :host {
      border-radius: 999px;
      background: linear-gradient(90deg,rgba(70,181,255,.12),rgba(127,108,255,.09));
      border: 1px solid rgba(126,190,255,.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  card-mod-dialog: |
    ha-dialog, ha-adaptive-dialog, .mdc-dialog__surface {
      background: radial-gradient(circle at 10% 0%,rgba(70,181,255,.08),transparent 32%),radial-gradient(circle at 100% 100%,rgba(127,108,255,.06),transparent 38%),rgba(13,22,38,.95) !important;
      border: 1px solid rgba(126,190,255,.16);
      border-radius: 20px !important;
      backdrop-filter: blur(22px) saturate(135%);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
      box-shadow: 0 28px 78px rgba(0,0,0,.48),0 0 36px rgba(70,181,255,.055);
    }
  card-mod-config: |
    :host { --ha-card-background: rgba(15,25,42,.86); --card-background-color: rgba(15,25,42,.86); }
  card-mod-panel-custom: |
    :host { background: transparent !important; }
  modes:
    dark:
      primary-background-color: "#0a1220"
      secondary-background-color: "#0b101e"
      card-background-color: "rgba(15, 25, 42, 0.88)"
      primary-text-color: "#f5f8ff"
      secondary-text-color: "#aebbd0"
